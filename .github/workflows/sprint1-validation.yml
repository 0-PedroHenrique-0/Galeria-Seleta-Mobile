name: Sprint 1 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile typecheck and Expo Android bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo Android export
        run: npx expo export --platform android --output-dir dist

  backend:
    name: Backend install and health check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install
      - name: Start API and check health
        shell: bash
        run: |
          node src/server.js > /tmp/galeria-api.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3333/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/galeria-api.log
          exit 1


  visual-evidence:
    name: Web screenshots for report
    runs-on: ubuntu-latest
    needs: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Export Expo web
        run: npx expo export --platform web --output-dir dist
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          npx serve dist -l 4173 > /tmp/galeria-web.log 2>&1 &
          echo $! > /tmp/galeria-web.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/galeria-web.log
          exit 1
      - name: Capture screenshots
        run: node scripts/capture-evidence.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-visual-evidence
          path: evidence/*.png
