name: Sprint 1 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile typecheck and Expo web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo web export
        run: npx expo export --platform web --output-dir dist

  backend:
    name: Backend install and health check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install
      - name: Start API and check health
        shell: bash
        run: |
          node src/server.js > /tmp/galeria-api.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3333/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/galeria-api.log
          exit 1
