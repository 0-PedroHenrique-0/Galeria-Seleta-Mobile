name: Testes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unitarios-app:
    name: Testes unitários do aplicativo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos com TypeScript
        run: npm run typecheck
      - name: Rodar testes unitários (Jest)
        run: npm test

  api:
    name: Testes da API
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências da API
        run: npm install
        working-directory: backend
      - name: Rodar testes da API
        run: npm run test:api

  e2e:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do aplicativo
        run: npm install
      - name: Instalar dependências da API
        run: npm install
        working-directory: backend
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Rodar testes E2E
        run: npm run test:e2e
      - name: Guardar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  dashboard:
    name: Testes do dashboard em Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do dashboard
        run: python -m pip install -r requirements.txt
      - name: Rodar testes do dashboard
        run: python -I -m unittest
